  <body>
    <div id="root"></div>

    <!-- Definição global de filtros SVG para refração de Fluid Glass Real -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none; overflow: hidden;" aria-hidden="true">
      <defs>
        <!-- Filtro de Refração Líquida Suave -->
        <filter id="fluid-glass-refraction" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02 0.04" numOctaves="2" result="noise" />
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <!-- Filtro de Refração Líquida Viva / Gelatina -->
        <filter id="fluid-glass-active" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="turbulence" baseFrequency="0.035 0.03" numOctaves="3" result="turb" />
          <feDisplacementMap in="SourceGraphic" in2="turb" scale="14" xChannelSelector="R" yChannelSelector="B" />
        </filter>
      </defs>
    </svg>

  </body>
